# SIHTRACK System Configuration
# SIH26078: AI-Driven Spatio-Temporal Tracking of Extreme Weather Anomalies

system:
  name: "SIHTRACK"
  version: "2.0.0-production"
  environment: "production"
  default_mode: "REAL"  # "REAL" | "DEMO"
  fallback_to_demo: true

geography:
  region: "Indian Subcontinent"
  bounds:
    lat_min: 6.0
    lat_max: 38.0
    lon_min: 68.0
    lon_max: 98.0
  resolution_deg: 0.25  # ~28 km grid spacing
  projection: "EPSG:4326"

meteorology:
  forecast_horizon_hours: 120
  time_step_hours: 6
  variables:
    - name: "temperature_2m"
      unit: "celsius"
      climatology_baseline: "ERA5_30yr"
      anomaly_method: "z_score"
      z_threshold: 2.5
    - name: "precipitation"
      unit: "mm_per_h"
      climatology_baseline: "ERA5_30yr"
      anomaly_method: "percentile"
      percentile_high: 95.0
      percentile_extreme: 99.0
    - name: "wind_speed_10m"
      unit: "m_per_s"
      z_threshold: 2.2
    - name: "mean_sea_level_pressure"
      unit: "hPa"
      z_threshold: -2.3
    - name: "relative_humidity_2m"
      unit: "percent"
      z_threshold: 2.0

providers:
  active: "open_meteo"  # "open_meteo" | "ecmwf" | "ncmrwf" | "demo"
  open_meteo:
    base_url: "https://api.open-meteo.com/v1/forecast"
    model: "ecmwf_ifs025"
    lead_time_days: 5
    timeout_sec: 10
  ecmwf:
    dataset: "ifs"
    resolution: "0.25deg"
    endpoint_status: "operational_api_ready"
  ncmrwf:
    dataset: "imdaa_ngfs"
    resolution: "12km"
    endpoint_status: "institutional_gateway"

tracking:
  clustering:
    connectivity: 8
    min_cluster_cells: 4
    min_area_km2: 3000
  temporal_matching:
    algorithm: "hungarian"
    max_search_radius_km: 450
    weights:
      distance: 0.40
      area_difference: 0.25
      intensity_difference: 0.20
      iou_overlap: 0.15

machine_learning:
  model_type: "ConvLSTMWeatherTracker"
  checkpoint_path: "models/convlstm_weather_tracker.pt"
  metadata_path: "models/model_metadata.json"
  feature_config_path: "models/feature_config.json"
  architecture:
    input_channels: 4
    hidden_dims: [32, 16]
    kernel_size: 3
    num_layers: 2
    state_vector_dim: 4  # [lat, lon, intensity, extent_km]
  uncertainty:
    base_spread_km: 35.0
    hourly_growth_factor: 1.45
    min_confidence: 0.40
    max_confidence: 0.98

server:
  host: "0.0.0.0"
  port: 8000
  api_prefix: "/api/v1"
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:3000"
